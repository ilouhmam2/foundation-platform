spring:
  application:
    name: foundation-sample-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Override with your IDP's JWK Set URI
          # Example: https://your-idp.example.com/realms/your-realm/protocol/openid-connect/certs
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/dev/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

foundation:
  security:
    public-paths:
      - /actuator/health
      - /actuator/health/**
  observability:
    application-name: foundation-sample-service
    environment: ${APP_ENV:dev}
  logging:
    json-format: ${LOG_JSON:false}

server:
  port: 8080
