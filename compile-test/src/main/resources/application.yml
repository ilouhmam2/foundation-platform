spring:
  application:
    name: compile-test
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://your-idp/.well-known/openid-configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/compile-test
    username: compile-test
    password: changeme
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

foundation:
  logging:
    json-format: true
  nats:
    server-url: nats://localhost:4222
